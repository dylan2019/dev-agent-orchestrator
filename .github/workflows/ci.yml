name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run release:check
      - run: npm pack --dry-run

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Build release evidence
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm pack
          npm run release:sbom -- --output-file "dev-agent-orchestrator-${version}.sbom.cdx.json"
          sha256sum "dev-agent-orchestrator-${version}.tgz" "dev-agent-orchestrator-${version}.sbom.cdx.json" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --generate-notes --title "Dev Agent Orchestrator ${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "dev-agent-orchestrator-${GITHUB_REF_NAME#v}.tgz" "dev-agent-orchestrator-${GITHUB_REF_NAME#v}.sbom.cdx.json" SHA256SUMS
